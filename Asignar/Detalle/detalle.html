<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de territorio | SSC</title>
    <link rel="stylesheet" href="../../Shared/spinner.css">
    <!-- Estilos exclusivos del detalle de territorio. -->
    <link rel="stylesheet" href="detalle.css">
</head>

<body>
    <!-- Contenedor independiente para los estilos del detalle. -->
    <div class="ssc-detalle">

        <!-- Regresa a la lista de territorios del módulo Asignar. -->
        <header class="ssc-detalle__header">
            <div class="ssc-detalle__header-content">
                <a class="ssc-detalle__back" href="../asignar.html" aria-label="Volver a territorios">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 12H5m7-7-7 7 7 7"></path>
                    </svg>
                </a>

                <h1 class="ssc-detalle__title">Detalle de Territorio</h1>
            </div>
        </header>

        <main class="ssc-detalle__content">
            <!-- Comunica la carga, los errores y los resultados vacíos. -->
            <div id="detalleStatus" class="ssc-detalle__notice" role="status" aria-live="polite">
                Preparando consulta del detalle…
            </div>

            <!-- Se completará con conductores de la hoja Configuración. -->
            <div id="detalleConductorGroup" class="ssc-detalle__conductor" hidden>
                <!-- El icono acompaña la etiqueta del selector. -->
                <label for="detalleConductor">
                    <svg class="ssc-detalle__label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="7" r="4"></circle>
                        <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                    </svg>
                    Conductor
                </label>
                <select id="detalleConductor" disabled>
                    <option value="">Seleccionar conductor…</option>
                </select>
            </div>

            <!-- Identificación del territorio recibida del backend. -->
            <section id="detalleTerritorioGroup" aria-labelledby="detalleTerritorio" hidden>
                <p class="ssc-detalle__section-title">Territorio</p>
                <!-- Agrupa el icono decorativo y el nombre del territorio. -->
                <div class="ssc-detalle__territory">
                    <span class="ssc-detalle__territory-icon" aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"></path>
                            <path d="M9 3v15M15 6v15"></path>
                        </svg>
                    </span>

                    <h2 id="detalleTerritorio">—</h2>
                </div>
            </section>

            <!-- Aquí agregaremos las tarjetas seleccionables. -->
            <section id="detalleTarjetasGroup" aria-labelledby="detalleTarjetasTitulo" hidden>
                <h2 id="detalleTarjetasTitulo" class="ssc-detalle__section-title">
                    Tarjetas disponibles
                </h2>

                <!-- Lista que completará el controlador con tarjetas reales. -->
                <ul id="detalleTarjetas" class="ssc-detalle__cards"></ul>

                <!-- Conserva el diseño de una tarjeta para generar las demás. -->
                <template id="detalleTarjetaTemplate">
                    <li>
                        <!-- Toda la tarjeta permite marcar su casilla. -->
                        <label class="ssc-detalle__card">
                            <span class="ssc-detalle__card-info">
                                <strong class="ssc-detalle__card-title">
                                    Tarjeta 2-1
                                </strong>

                                <!-- Datos de ejemplo para comprobar la distribución. -->
                                <!-- Iconos decorativos acompañados de texto legible. -->
                                <span class="ssc-detalle__card-meta">
                                    <span class="ssc-detalle__meta-item">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <circle cx="13" cy="4" r="2"></circle>
                                            <path d="m7 21 3-6-1-5 4-3 3 5h4"></path>
                                            <path d="m5 12 4-2m1 5 5 2 2 4m-4-14-1 6"></path>
                                        </svg>
                                        <span>Caminando</span>
                                    </span>

                                    <span class="ssc-detalle__meta-item">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <circle cx="12" cy="12" r="9"></circle>
                                            <path d="M12 7v5l3 2"></path>
                                        </svg>
                                        <span>20 min</span>
                                    </span>
                                </span>
                            </span>

                            <!-- Selección visual; todavía no registra asignaciones. -->
                            <input class="ssc-detalle__checkbox" type="checkbox" name="tarjetas" value="2-1"
                                aria-label="Seleccionar tarjeta 2-1">
                        </label>
                    </li>
                </template>
            </section>
        </main>

        <!-- Acción deshabilitada durante la construcción visual. -->
        <footer id="detalleFooter" class="ssc-detalle__footer" hidden>
            <!-- Permanece deshabilitado hasta implementar la asignación. -->
            <button id="detalleAsignar" type="button" class="ssc-detalle__assign" disabled>
                <svg class="ssc-detalle__assign-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="18" rx="2"></rect>
                    <path d="M9 4V2h6v2"></path>
                    <circle cx="12" cy="11" r="2"></circle>
                    <path d="M8 18a4 4 0 0 1 8 0"></path>
                </svg>
                <span>Asignar</span>
            </button>
        </footer>

    </div>

    <!-- Consulta el territorio elegido y completa los controles del detalle. -->
    <script type="module" src="detalle.controller.js"></script>
</body>

</html>
