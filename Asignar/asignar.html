<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asignar territorios | SSC</title>
    <link rel="stylesheet" href="../Shared/spinner.css">
    <link rel="stylesheet" href="asignar.css">
</head>
<body>
    <div class="ssc-asignar">
        <header class="ssc-asignar__header">
            <div class="ssc-asignar__header-content">
                <a class="ssc-asignar__back" href="../home/home.html?origen=asignar" aria-label="Volver a Inicio">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 12H5m7-7-7 7 7 7"></path>
                    </svg>
                </a>
                <h1>Asignar Territorios</h1>
                <button id="asignarActualizar" class="ssc-asignar__refresh" type="button"
                    aria-label="Actualizar datos de asignación" title="Actualizar datos" disabled>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 6v5h-5"></path>
                        <path d="M4 18v-5h5"></path>
                        <path d="M6.1 9a7 7 0 0 1 11.8-2.6L20 11"></path>
                        <path d="m4 13 2.1 4.6A7 7 0 0 0 17.9 15"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="ssc-asignar__content">
            <div id="asignarStatus" class="ssc-asignar__status" role="status" aria-live="polite">
                Preparando asignación…
            </div>

            <div id="asignarControles" hidden>
                <section class="ssc-asignar__section">
                    <label class="ssc-asignar__label" for="asignarConductor">Conductor</label>
                    <select id="asignarConductor" class="ssc-asignar__select" disabled>
                        <option value="">Seleccionar conductor…</option>
                    </select>
                </section>

                <section class="ssc-asignar__section">
                    <label class="ssc-asignar__label" for="asignarTerritorio">Territorio</label>
                    <select id="asignarTerritorio" class="ssc-asignar__select" disabled>
                        <option value="">Seleccionar territorio…</option>
                    </select>
                </section>

                <section class="ssc-asignar__section" aria-labelledby="asignarTarjetasTitulo">
                    <div class="ssc-asignar__section-heading">
                        <h2 id="asignarTarjetasTitulo">Tarjetas disponibles</h2>
                        <span id="asignarSeleccionActual"></span>
                    </div>
                    <p id="asignarTarjetasStatus" class="ssc-asignar__helper">
                        Selecciona un territorio para ver sus tarjetas.
                    </p>
                    <ul id="asignarTarjetas" class="ssc-asignar__cards"></ul>
                </section>
            </div>
        </main>

        <footer class="ssc-asignar__footer">
            <button id="asignarRevisar" type="button" disabled>Revisar asignación</button>
        </footer>

        <template id="asignarTarjetaTemplate">
            <li>
                <div class="ssc-asignar__card">
                    <label class="ssc-asignar__card-main">
                        <span class="ssc-asignar__card-info">
                            <strong class="ssc-asignar__card-title"></strong>
                            <span class="ssc-asignar__card-meta"></span>
                        </span>
                        <input class="ssc-asignar__checkbox" type="checkbox">
                    </label>
                    <fieldset class="ssc-asignar__delivery" hidden>
                        <legend>Entrega al conductor</legend>
                        <label>
                            <input class="ssc-asignar__delivery-option" type="radio" value="Digital">
                            Digital
                        </label>
                        <label>
                            <input class="ssc-asignar__delivery-option" type="radio" value="Física">
                            Física
                        </label>
                    </fieldset>
                </div>
            </li>
        </template>
    </div>

    <script type="module" src="asignar.controller.js"></script>
</body>
</html>
