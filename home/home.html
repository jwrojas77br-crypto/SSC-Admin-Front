<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio | SSC</title>
    <link rel="stylesheet" href="../Shared/spinner.css">
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <div id="homeSessionStatus" role="status">
        Comprobando sesión…
    </div>

    <section class="ssc-home" aria-label="Inicio" hidden>
        <header class="ssc-home__header">
            <img class="ssc-home__logo" src="../icons/icon.png" alt="" width="48" height="48">

            <div>
                <h1 class="ssc-home__title">SSC</h1>
                <p class="ssc-home__subtitle">
                    Sistema del servicio del campo
                </p>
            </div>

            <div class="ssc-home__tools">
                <button type="button" class="ssc-home__tool" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        aria-hidden="true">
                        <circle cx="10.5" cy="10.5" r="6.5"></circle>
                        <path d="m16 16 5 5"></path>
                    </svg>
                </button>

                <button type="button" id="homeSettingsButton" class="ssc-home__tool" aria-label="Configuración">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        aria-hidden="true">
                        <path d="M4 7h16M4 17h16"></path>
                        <circle cx="9" cy="7" r="3" fill="#192233"></circle>
                        <circle cx="15" cy="17" r="3" fill="#192233"></circle>
                    </svg>
                </button>
            </div>

            <div class="ssc-home__user" aria-label="Usuario actual">
                <span class="ssc-home__avatar" id="homeUserInitials" aria-hidden="true">—</span>

                <div class="ssc-home__user-info">
                    <p class="ssc-home__user-name" id="homeUserName">—</p>

                    <p class="ssc-home__user-role">
                        <span class="ssc-home__role-code" id="homeUserRoleCode">—</span>
                        <span id="homeUserRoleName">—</span>
                    </p>
                </div>
            </div>
        </header>

        <div class="ssc-home__content">
            <div class="ssc-home__section-heading">
                <h2 class="ssc-home__section-title">Resumen general</h2>
                <button id="homeSummaryRefresh" class="ssc-home__refresh" type="button"
                    aria-label="Actualizar resumen general" title="Actualizar resumen" disabled>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 6v5h-5"></path>
                        <path d="M4 18v-5h5"></path>
                        <path d="M6.1 9a7 7 0 0 1 11.8-2.6L20 11"></path>
                        <path d="m4 13 2.1 4.6A7 7 0 0 0 17.9 15"></path>
                    </svg>
                </button>
            </div>

            <div id="homeSummaryStatus" role="status" aria-live="polite">
                Cargando resumen…
            </div>

            <div class="ssc-home__stats" hidden>
                <article class="ssc-home__stat">
                    <div class="ssc-home__stat-top">
                        <svg class="ssc-home__stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                            <path d="M3 10h18M7 15h4"></path>
                        </svg>

                    </div>
                    <h3 class="ssc-home__stat-label">Tarjetas disponibles</h3>
                    <p class="ssc-home__stat-value" id="homeAvailableCount">—</p>
                </article>

                <article class="ssc-home__stat ssc-home__stat--assigned">
                    <div class="ssc-home__stat-top">
                        <svg class="ssc-home__stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" aria-hidden="true">
                            <rect x="5" y="4" width="14" height="17" rx="2"></rect>
                            <path d="M9 4V2h6v2M15 12H9m3-3-3 3 3 3"></path>
                        </svg>

                    </div>
                    <h3 class="ssc-home__stat-label">Tarjetas asignadas</h3>
                    <p class="ssc-home__stat-value" id="homeAssignedCount">—</p>
                </article>

                <article class="ssc-home__stat ssc-home__stat--pending">
                    <div class="ssc-home__stat-top">
                        <svg class="ssc-home__stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M12 7v5l3 2"></path>
                        </svg>
                    </div>
                    <h3 class="ssc-home__stat-label">Pendientes por asignar</h3>
                    <p class="ssc-home__stat-value" id="homePendingCount">—</p>
                </article>
            </div>
        </div>

        <div class="ssc-home__content">
            <h2 class="ssc-home__section-title">Acciones principales</h2>

            <!-- Contenedor que distribuye las dos acciones en columnas. -->
            <div class="ssc-home__actions">

                <!-- Asignar navega a su pantalla y conserva el estilo de tarjeta. -->
                <a href="../Asignar/asignar.html?nueva=1" class="ssc-home__action">
                    <span class="ssc-home__action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"></path>
                        </svg>
                    </span>
                    <span class="ssc-home__action-text">
                        <strong>Asignar</strong>
                        <span>Entregar tarjeta</span>
                    </span>
                </a>

                <!-- Devolver permanece como una acción independiente. -->
                <button type="button" class="ssc-home__action ssc-home__action--return">
                    <span class="ssc-home__action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 3v13m-5-5 5 5 5-5M4 16v5h16v-5"></path>
                        </svg>
                    </span>
                    <span class="ssc-home__action-text">
                        <strong>Devolver</strong>
                        <span>Recibir tarjeta</span>
                    </span>
                </button>

                <a href="../Reasignar/reasignar.html" class="ssc-home__action ssc-home__action--reassign">
                    <span class="ssc-home__action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 7h-9a4 4 0 0 0-4 4v1"></path>
                            <path d="m17 4 3 3-3 3"></path>
                            <path d="M4 17h9a4 4 0 0 0 4-4v-1"></path>
                            <path d="m7 20-3-3 3-3"></path>
                        </svg>
                    </span>
                    <span class="ssc-home__action-text">
                        <strong>Reasignar</strong>
                        <span>Cambiar conductor</span>
                    </span>
                </a>
            </div>
        </div>
    </section>

    <script type="module" src="home.controller.js"></script>
</body>

</html>
